<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Tablet ve Telefondan Bağlan</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 36px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; color: #4f46e5; }
    p { font-size: 1rem; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
    .qr-box {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-box img {
      display: block;
      width: 220px;
      height: 220px;
    }
    .url-badge {
      display: inline-block;
      background: #eef2ff;
      color: #4338ca;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid #c7d2fe;
      word-break: break-all;
    }
    .tip {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 Tablet veya Telefondan Aç</h1>
    <p>Tablet veya telefonunuzun kamerası ile aşağıdaki QR kodu okutarak çalışma portalına doğrudan bağlanabilirsiniz:</p>
    
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=http://192.168.1.113:8000" alt="QR Kod">
    </div>

    <div>
      <p style="margin-bottom: 8px; font-weight: 600; color: #475569;">Veya tarayıcıya doğrudan şu adresi yazın:</p>
      <div class="url-badge">http://192.168.1.113:8000</div>
    </div>

    <div class="tip">
      ⚠️ <em>Tabletinizin bilgisayarla aynı ev/ofis Wi-Fi ağına bağlı olduğundan emin olun.</em>
    </div>
  </div>
</body>
</html>
